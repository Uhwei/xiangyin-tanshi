<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>乡音探事 · 灰盒 Demo｜第 1 案：魔神仔传闻</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%230B1210'/%3E%3Ccircle cx='12' cy='12' r='6.4' fill='none' stroke='%23D99B4E' stroke-width='1.6'/%3E%3C/svg%3E">
<style>
:root{
  --night:#0B1210;
  --night2:#131C18;
  --paper:#EBE1CB;
  --paper-dim:#DFD3B8;
  --ink:#1B1813;
  --ink-soft:#4A443A;
  --red:#A73A2C;
  --lamp:#D99B4E;
  --sea:#6E8B86;
  --muted:#7A8579;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(1200px 700px at 78% 96%, rgba(217,155,78,.16), transparent 60%),
    radial-gradient(900px 600px at 12% -10%, rgba(110,139,134,.14), transparent 62%),
    linear-gradient(180deg,#08100E 0%, #0B1210 45%, #0A0F0D 100%);
  color:#D8CFBA;
  font-family:"Songti SC","Source Han Serif SC","Noto Serif SC",SimSun,"PingFang SC",serif;
  font-size:16px;
  line-height:1.75;
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.42) 100%);
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background-image:repeating-linear-gradient(0deg, rgba(255,255,255,.022) 0 1px, transparent 1px 3px);
}
#app{position:relative;z-index:1;min-height:100vh;display:grid;grid-template-columns:1fr}

/* ===== 左侧卷宗夹 / 窄屏顶端 ===== */
#rail{
  border-bottom:1px solid rgba(217,155,78,.22);
  padding:16px 18px 18px;
  background:linear-gradient(180deg, rgba(19,28,24,.9), rgba(11,18,16,.6));
}
@media (min-width:940px){
  #app{grid-template-columns:242px 1fr}
  #rail{border-bottom:0;border-right:1px solid rgba(217,155,78,.22);padding:26px 20px;position:sticky;top:0;height:100vh;overflow:auto}
}
.brand{
  font-size:13px;letter-spacing:.32em;color:var(--lamp);opacity:.85;margin:0 0 4px
}
.rail-title{font-size:15px;color:#E7DEC6;margin:0 0 2px;letter-spacing:.08em}
.rail-sub{font-size:12px;color:var(--muted);letter-spacing:.06em;margin:0 0 18px}
.stages{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.stage-dot{
  font-size:12px;color:var(--muted);border:1px solid rgba(217,155,78,.28);
  padding:3px 9px;letter-spacing:.12em;background:transparent
}
.stage-dot.on{color:#0B1210;background:var(--lamp);border-color:var(--lamp)}
.stage-dot.done{color:#C9BFA8;border-color:rgba(201,191,168,.5)}
.clue-head{font-size:11px;letter-spacing:.24em;color:var(--muted);margin:0 0 8px}
#clue-list{list-style:none;padding:0;margin:0;display:grid;gap:9px}
.clue-item{
  font-size:13px;line-height:1.6;color:#C6BCA5;padding-left:16px;position:relative;
  border-left:0;
}
.clue-item::before{
  content:"○";position:absolute;left:0;top:0;color:var(--muted);font-size:11px
}
.clue-item.filled::before{content:"●";color:var(--lamp)}
.clue-item.filled{color:#E6DCC2}
.clue-item.fresh{animation:flash .9s ease}
@keyframes flash{0%{color:var(--lamp);transform:translateX(-4px)}100%{color:#E6DCC2;transform:none}}
.rail-foot{font-size:11px;color:#5E6A62;margin-top:20px;line-height:1.7}

/* ===== 主舞台 ===== */
#stage{padding:26px 20px 60px;display:flex;justify-content:center}
.wrap{width:100%;max-width:760px}
.panel{
  border:1px solid rgba(217,155,78,.2);
  background:linear-gradient(180deg, rgba(19,28,24,.72), rgba(12,19,17,.9));
  padding:22px 22px 24px;
  position:relative;
}
.panel::before{
  content:"";position:absolute;left:0;right:0;top:0;height:1px;
  background:linear-gradient(90deg, transparent, rgba(217,155,78,.5), transparent);
}
.eyebrow{font-size:11px;letter-spacing:.3em;color:var(--lamp);margin:0 0 10px;opacity:.9}
h1.title{font-size:34px;line-height:1.3;margin:0 0 6px;color:#F0E7CF;font-weight:400;letter-spacing:.04em}
.lede{font-size:14px;color:#B9AF98;margin:0 0 20px;line-height:1.9}
.rule{height:1px;background:rgba(217,155,78,.22);margin:20px 0}
.small{font-size:12px;color:var(--muted);line-height:1.8}

/* 委托单 */
.doc{
  background:var(--paper);color:var(--ink);padding:20px 22px;
  border:1px solid #C7B893;
  box-shadow:0 10px 30px rgba(0,0,0,.45), inset 0 0 0 6px rgba(199,184,147,.18);
  font-size:15px;line-height:1.95;
  position:relative;
}
.doc .doc-no{font-size:11px;letter-spacing:.16em;color:#7A6A4E;margin-bottom:8px}
.doc .doc-line{font-family:"Kaiti SC","KaiTi","STKaiti",serif;font-size:19px;line-height:2;margin:6px 0}
.doc .doc-zh{font-size:12.5px;color:#6E6248;margin:0 0 10px}
.doc .seal{
  position:absolute;right:16px;bottom:14px;width:74px;height:74px;border-radius:50%;
  border:2px solid rgba(167,58,44,.55);color:rgba(167,58,44,.72);
  display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:11px;line-height:1.3;letter-spacing:.06em;transform:rotate(-8deg)
}

/* 对白 */
.who{
  font-size:12px;letter-spacing:.2em;color:var(--lamp);margin:0 0 6px
}
.line{font-family:"Kaiti SC","KaiTi","STKaiti",serif;font-size:21px;line-height:1.95;color:#F2E9D2;margin:0 0 4px}
.gloss{font-size:13px;color:#9C937E;line-height:1.8;margin:0 0 14px}
.narr{font-size:14px;color:#B4AB95;line-height:1.9;margin:0 0 14px;font-style:normal}
.cards{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.chip{
  font-family:inherit;font-size:12.5px;color:#E3D9C0;background:rgba(217,155,78,.1);
  border:1px dashed rgba(217,155,78,.45);padding:3px 10px;cursor:pointer;letter-spacing:.06em
}
.chip:hover{background:rgba(217,155,78,.2)}
.chip .note{display:none;color:#A9B3A8}
.chip.open{background:rgba(217,155,78,.22);border-style:solid}
.chip.open .note{display:inline;margin-left:8px}

/* 选项 */
.prompt{font-size:13px;color:#A9A18C;margin:0 0 10px;letter-spacing:.04em}
.options{display:grid;gap:10px;margin:0 0 8px}
.opt{
  text-align:left;font-family:inherit;cursor:pointer;
  background:var(--paper);color:var(--ink);border:1px solid #C7B893;
  padding:12px 15px;transition:transform .14s ease, box-shadow .14s ease, background .14s ease;
  box-shadow:0 3px 0 rgba(0,0,0,.3);
}
.opt:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.4)}
.opt .o-np{font-family:"Kaiti SC","KaiTi","STKaiti",serif;font-size:17px;line-height:1.7;display:block;margin-bottom:3px}
.opt .o-zh{font-size:12.5px;color:#6B6049;display:block}
.opt.dead{opacity:.42;cursor:default;transform:none;box-shadow:none;background:var(--paper-dim)}
.opt.dead .o-zh::after{content:"　· 这条问不出东西";color:#8A7C5E}
.fail{
  font-size:13px;color:#D9A08F;background:rgba(167,58,44,.12);
  border:1px solid rgba(167,58,44,.35);padding:10px 13px;margin:12px 0 0;line-height:1.8
}
.btn{
  font-family:inherit;cursor:pointer;font-size:14px;letter-spacing:.14em;
  padding:11px 20px;border:1px solid rgba(217,155,78,.55);background:transparent;color:#EBDDBB;
  transition:background .16s ease, color .16s ease
}
.btn:hover{background:rgba(217,155,78,.16)}
.btn.primary{background:var(--lamp);border-color:var(--lamp);color:#12100C}
.btn.primary:hover{background:#E7AC60}
.btn.ghost{border-color:rgba(216,207,186,.32);color:#BFB6A0;font-size:13px;padding:8px 14px}
.btn:disabled{opacity:.35;cursor:not-allowed}

/* 汇报 */
.slots{display:grid;gap:18px;margin:18px 0}
.slot{}
.slot-title{font-size:12px;letter-spacing:.2em;color:var(--lamp);margin:0 0 8px}
.slot .options{gap:8px}
.slot .opt{padding:10px 13px}
.slot .opt .o-np{font-size:15.5px;margin:0}
.opt.sel{background:#F3EAD5;border-color:var(--lamp);box-shadow:0 0 0 2px rgba(217,155,78,.35)}
.rec{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0;padding:12px;border:1px solid rgba(110,139,134,.3);background:rgba(110,139,134,.06)}
.rec-dot{width:8px;height:8px;background:var(--red);display:inline-block;border-radius:50%}
.rec-dot.live{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.rec-time{font-size:13px;color:#CFC5AD;font-variant-numeric:tabular-nums}

/* 结果 */
.receipt{
  background:var(--paper);color:var(--ink);padding:20px 22px;border:1px solid #C7B893;line-height:1.95;font-size:14.5px
}
.receipt .sig{text-align:right;font-family:"Kaiti SC","KaiTi",serif;color:#5C5140;margin-top:12px}
.bad{color:#8C3225}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.tag{font-size:12px;padding:2px 8px;border:1px solid rgba(217,155,78,.4);color:#E6DCC2}
.tag.miss{border-color:rgba(167,58,44,.6);color:#D99E8D}

/* 证书 */
.cert-wrap{display:flex;justify-content:center;padding:6px 0 4px}
.cert{
  width:100%;max-width:520px;background:linear-gradient(160deg,#F2E9D4,#E3D8BD);
  color:#241F16;padding:22px 22px 24px;position:relative;
  border:1px solid #C3B695;box-shadow:0 14px 40px rgba(0,0,0,.55);
  animation:drop .5s ease
}
@keyframes drop{0%{transform:translateY(-14px) scale(.98);opacity:0}100%{transform:none;opacity:1}}
.cert .c-top{display:flex;justify-content:space-between;font-size:10.5px;letter-spacing:.18em;color:#6E6248;border-bottom:1px solid #BDAF8C;padding-bottom:6px}
.cert h3{font-size:19px;letter-spacing:.36em;margin:16px 0 2px;font-weight:400}
.cert .c-rank{font-size:13px;letter-spacing:.2em;color:#6E6248;margin:0 0 14px}
.cert .c-body{display:grid;grid-template-columns:74px 1fr;gap:14px;align-items:start}
.cert .photo{height:92px;border:1px solid #9C8E6C;background:
  repeating-linear-gradient(135deg,#DCD0B4 0 6px,#D3C6A8 6px 12px);
  position:relative}
.cert .photo::after{content:"相片";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#8B7D5C;letter-spacing:.2em}
.cert .fields{font-size:13px;line-height:1.95}
.cert .fields b{font-weight:400;color:#6E6248;letter-spacing:.06em;display:inline-block;min-width:52px}
.cert .stamp{
  position:absolute;right:14px;bottom:14px;width:88px;height:88px;border-radius:50%;
  border:2.5px solid rgba(167,58,44,.62);color:rgba(167,58,44,.72);transform:rotate(-11deg);
  display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;line-height:1.35;letter-spacing:.08em
}
.cert .note{font-size:11.5px;color:#5E5442;margin-top:14px;border-top:1px dashed #B6A987;padding-top:10px;line-height:1.8}

/* 参数面板 */
#debug{
  display:none;position:fixed;right:14px;bottom:14px;z-index:6;max-width:330px;
  background:rgba(10,16,14,.96);border:1px solid rgba(217,155,78,.4);padding:12px 14px;
  font-size:11.5px;line-height:1.7;color:#C9C0AA;font-family:ui-monospace,Menlo,Consolas,monospace
}
#debug.on{display:block}
#debug pre{margin:6px 0 0;white-space:pre-wrap;font-size:11px;color:#9DA89C}
.dbg-btn{position:fixed;right:14px;bottom:14px;z-index:5;font-size:11px;letter-spacing:.16em;
  background:transparent;border:1px solid rgba(217,155,78,.3);color:#8E9587;padding:6px 10px;cursor:pointer;font-family:inherit}
.dbg-btn:hover{color:#E3D9C0}

@media (max-width:520px){
  h1.title{font-size:26px}
  .line{font-size:18px}
  .doc .doc-line{font-size:17px}
  #stage{padding:18px 14px 54px}
  .panel{padding:18px 15px 20px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="app">
  <aside id="rail">
    <p class="brand">南音馆 · 稽查组</p>
    <p class="rail-title">卷宗夹</p>
    <p class="rail-sub">第 1 案 · 魔神仔传闻</p>
    <div class="stages" id="stages"></div>
    <p class="clue-head">已录线索</p>
    <ul id="clue-list"></ul>
    <p class="rail-foot" id="rail-foot">见习稽查员 · 稽字第 0041 号<br>本卷宗不得携出后埕。</p>
  </aside>
  <main id="stage"><div class="wrap" id="wrap"></div></main>
</div>
<button class="dbg-btn" id="dbg-btn">原型参数</button>
<div id="debug"></div>
<script>
/* ============================================================
   《乡音探事》灰盒 Demo — ruleset_id: hiong_im.c1.v1
   说明：语音判定在本原型中以「文本选句」替代，判定逻辑与设计稿一致
        （关键词命中 + 结论句地道度分档）。录音仅作存档与回放。
   ============================================================ */

var RULESET = {
  ruleset_id: "hiong_im.c1.v1",
  pass_hits: 9,
  fallback_hits: 6,
  attempts_before_fallback: 3,
  total_kw: 11,
  required_word: "魔神仔",
  required_negatives: ["无影", "無影", "假", "不是", "没有", "呣是", "袂是"],
  elementary: { smart: 2, normal: 1, blunt: 0 },
  calorie_note: "关键词判定在文本层完成；录音不参与打分"
};

var KW = [
  {id:"a_peh",   label:"阿伯",   any:["阿伯"]},
  {id:"sann_siann", label:"三声", any:["三声","三聲"]},
  {id:"tsa_boo", label:"查某声", any:["查某声","查某聲"]},
  {id:"a_ti",    label:"阿弟",   any:["阿弟"]},
  {id:"se_han",  label:"细细汉", any:["细细汉","細細漢"]},
  {id:"kau_a",   label:"狗仔",   any:["狗仔"]},
  {id:"ta_kio",  label:"礁石",   any:["礁石"]},
  {id:"a_ma",    label:"阿嬷",   any:["阿嬷","阿嬤","阿媽"]},
  {id:"a_bing",  label:"阿明",   any:["阿明"]},
  {id:"sann_tang", label:"三冬", any:["三冬"]},
  {id:"mo_sin",  label:"魔神仔", any:["魔神仔"]}
];

var CLUES = [
  {id:"c1", text:"昨昏暗时，阿伯听着有人咧叫名，叫三声，第三声真近。"},
  {id:"c2", text:"叫声是查某声，老老的。"},
  {id:"c3", text:"龙眼林有一个细细汉的黑影，暗时伫树仔跤，无讲话。"},
  {id:"c4", text:"一只狗仔缀着黑影行。"},
  {id:"c5", text:"阿嬷讲日时袂使叫，人会议论。"},
  {id:"c6", text:"阿嬷逐暗举灯，讲灯照着，伊较看会着路。"}
];

/* ---------- 场景脚本 ---------- */
var SCENES = {
  shop: {
    label:"一 · 杂货店",
    steps: [
      {type:"line", who:"阿伯", np:"汝讲啥？", zh:"你说什么？"},
      {type:"line", who:"阿伯", np:"无啦，无代志。", zh:"没事啦，没事。",
       narr:"他低头继续剥花生。收音机里的南音换了一段，弦声压住了话头。"},
      {type:"ask", prompt:"换个问法。三句里只有一句他会接。",
       options:[
        {np:"阿伯，昨昏暗时发生啥物代志？", zh:"昨天夜里出了什么事？", ok:true, to:1},
        {np:"恁遮敢有魔神仔？", zh:"你们这儿有魔神仔吗？", fail:"阿伯忌讳这个话题，把花生壳一收，不讲了。"},
        {np:"这包薰偌济钱？", zh:"这包烟多少钱？", fail:"阿伯报了价钱，话头就这样断了。"}
       ]},
      {type:"line", who:"阿伯", np:"昨昏暗时，我咧关店，听着有人咧叫名。叫三声，第三声近近咧。我开门看，无半个人。",
       zh:"昨晚我关店时，听见有人在喊名字。喊了三声，第三声很近。我开门看，半个人也没有。",
       cards:[{w:"暗时",p:"àm-sî",g:"夜里"},{w:"叫名",p:"kiò-miâ",g:"喊名字"},{w:"近近咧",p:"kīn-kīn--leh",g:"很近"}],
       clue:"c1"},
      {type:"ask", prompt:"声音还得问细一点。",
       options:[
        {np:"是查埔声抑是查某声？", zh:"是男声还是女声？", ok:true, to:1},
        {np:"彼个人偌大汉？", zh:"那个人多高？", fail:"阿伯讲伊无看清楚，话又断了。"},
        {np:"敢是魔神仔？", zh:"是魔神仔吗？", fail:"他把收音机拧响了一点，装作没听见。"}
       ]},
      {type:"line", who:"阿伯", np:"查某声。老老的。讲三声就煞去，亲像咧叫囡仔转来。",
       zh:"女声。老老的。讲三声就停了，像是在喊小孩回家。",
       cards:[{w:"查某声",p:"tsa-bóo-siann",g:"女人的声音"},{w:"煞去",p:"suah--khì",g:"停掉、作罢"}],
       clue:"c2"},
      {type:"end", next:"orchard"}
    ]
  },
  orchard: {
    label:"二 · 龙眼林",
    steps: [
      {type:"line", who:"阿弟", np:"……", zh:"（他蹲在树下玩石子，不看你。）"},
      {type:"ask", prompt:"先递一颗糖，再说话。",
       options:[
        {np:"阿弟，汝敢有看着人？", zh:"阿弟，你有看到人吗？", ok:true, to:1},
        {np:"阿弟，汝食饱未？", zh:"阿弟，你吃饱了吗？", fail:"阿弟点头，又低下头去，不说话了。"},
        {np:"小朋友，昨晚看到什么了？", zh:"（普通话）小朋友，昨晚看到什么了？", fail:"他用普通话回你一句“不知道”，然后把嘴闭上了。"}
       ]},
      {type:"line", who:"阿弟", np:"有一个细细汉的，暗时伫树仔跤。",
       zh:"有个矮矮的，晚上在树底下。",
       cards:[{w:"细细汉",p:"sè-sè-hàn",g:"个子小"},{w:"树仔跤",p:"tshiū-á-kha",g:"树下"}],
       clue:"c3"},
      {type:"ask", prompt:"再问一层。",
       options:[
        {np:"伊敢会讲话？", zh:"他会说话吗？", ok:true, to:1},
        {np:"伊偌大汉？", zh:"他多高？", fail:"阿弟比了个手势，讲伊毋知影，又蹲回去玩石子。"},
        {np:"汝敢会惊？", zh:"你会怕吗？", fail:"阿弟摇头，不肯多讲。"}
       ]},
      {type:"line", who:"阿弟", np:"无讲话，干焦狗仔缀伊行。彼只是阿嬷的。",
       zh:"不说话，只有狗跟着他走。那只狗是阿嬷的。",
       cards:[{w:"干焦",p:"kan-ta",g:"只、仅仅"},{w:"缀",p:"tuè",g:"跟着走"}],
       clue:"c4"},
      {type:"end", next:"reef"}
    ]
  },
  reef: {
    label:"三 · 礁石",
    steps: [
      {type:"line", who:"", narr:"夜里风大。礁石上有一点灯，灯下有人背对着你，正对着海面。"},
      {type:"ask", prompt:"先开口，才有资格走近。",

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ---------- 卷宗夹 ---------- */
function renderRail(){
  var order = ["shop","orchard","reef"];
  var curIdx = order.indexOf(state.scene);
  var html = "";
  order.forEach(function(k,i){
    var cls = "stage-dot";
    if(state.scene === k) cls += " on";
    else if(curIdx > i || state.scene === "report" || state.scene === "result" || state.scene === "cert") cls += " done";
    html += '<span class="'+cls+'">'+SCENES[k].label+'</span>';
  });
  if(state.scene === "report" || state.scene === "result" || state.scene === "cert"){
    html += '<span class="stage-dot on">四 · 汇报</span>';
  }
  stagesEl.innerHTML = html;

  var list = "";
  CLUES.forEach(function(c){
    var has = state.clues.indexOf(c.id) > -1;
    list += '<li class="clue-item '+(has?"filled":"")+(has && state.lastFresh===c.id?" fresh":"")+'">'+(has?esc(c.text):"——")+'</li>';
  });
  clueList.innerHTML = list;
  state.lastFresh = null;
}

function addClue(id){
  if(!id || state.clues.indexOf(id) > -1) return;
  state.clues.push(id);
  state.lastFresh = id;
  log("线索入卷："+id);
  renderRail();
}

/* ---------- 通用渲染 ---------- */
function go(scene){
  state.scene = scene;
  state.step = 0;
  state.lastFresh = null;
  renderRail();
  render();
}

function render(){
  if(state.scene === "intro") return renderIntro();
  if(state.scene === "report") return renderReport();
  if(state.scene === "result") return renderResult();
  if(state.scene === "cert") return renderCert();
  return renderStep();
}

function advance(){
  var scene = SCENES[state.scene];
  if(!scene) return;
  var step = scene.steps[state.step];
  var jump = (step && step.to) ? step.to : 1;
  state.step += jump;
  finishOrRender(scene);
}

function finishOrRender(scene){
  if(state.step >= scene.steps.length){
    go(scene.steps[scene.steps.length-1].next);
    return;
  }
  if(scene.steps[state.step].type === "end"){
    go(scene.steps[state.step].next);
    return;
  }
  render();
}

function renderStep(){
  var scene = SCENES[state.scene];
  var step = scene.steps[state.step];
  wrap.dataset.pendingClue = "";
  var html = '<p class="eyebrow">'+esc(scene.label)+'</p>';

  if(step.type === "line"){
    if(step.who){ html += '<p class="who">'+esc(step.who)+'</p>'; }
    if(step.np){ html += '<p class="line">'+esc(step.np)+'</p>'; }
    if(step.zh){ html += '<p class="gloss">'+esc(step.zh)+'</p>'; }
    if(step.narr){ html += '<p class="narr">'+esc(step.narr)+'</p>'; }
    if(step.cards){
      html += '<div class="cards">';
      step.cards.forEach(function(c,i){
        html += '<button class="chip" data-chip="'+i+'">'+esc(c.w)+'<span class="note">'+esc(c.p)+'　'+esc(c.g)+'</span></button>';
      });
      html += '</div>';
    }
    html += '<button class="btn ghost" data-act="next">继续</button>';
    if(step.clue){
      // 线索在“继续”时入卷，避免提前揭示
      wrap.dataset.pendingClue = step.clue;
    }
  } else if(step.type === "ask"){
    html += '<p class="prompt">'+esc(step.prompt)+'</p><div class="options">';
    step.options.forEach(function(o,i){
      var dead = state["dead_"+state.scene+"_"+state.step+"_"+i] ? " dead" : "";
      html += '<button class="opt'+dead+'" data-opt="'+i+'"><span class="o-np">'+esc(o.np)+'</span><span class="o-zh">'+esc(o.zh)+'</span></button>';
    });
    html += '</div><div id="failbox"></div>';
  }

  wrap.innerHTML = '<div class="panel">'+html+'</div>';
  afterRender();
}

function afterRender(){
  var nextBtn = wrap.querySelector('[data-act="next"]');
  if(nextBtn){
    nextBtn.addEventListener("click", function(){
      var pending = wrap.dataset.pendingClue;
      wrap.dataset.pendingClue = "";
      if(pending){ addClue(pending); }
      advance();
    });
  }
  wrap.querySelectorAll("[data-chip]").forEach(function(b){
    b.addEventListener("click", function(){
      b.classList.toggle("open");
      if(b.classList.contains("open")){ state.cardsSeen++; }
    });
  });
  wrap.querySelectorAll("[data-opt]").forEach(function(b){
    b.addEventListener("click", function(){
      var i = Number(b.dataset.opt);
      var step = SCENES[state.scene].steps[state.step];
      var o = step.options[i];
      if(o.ok){
        log("问句采用："+o.np);
        state.stepJumpPending = o.to || 1;
        // 采用后直接进入下一步；o.to 表示向后跳的步数（ask 自身不算）
        state.step += (o.to || 1);
        finishOrRender(SCENES[state.scene]);
      } else {
        state["dead_"+state.scene+"_"+state.step+"_"+i] = true;
        b.classList.add("dead");
        var fb = document.getElementById("failbox");
        fb.innerHTML = '<div class="fail">'+esc(o.fail)+'</div>';
        log("问句失效："+o.np);
      }
    });
  });
}

function toggleRec(){
  var btn = document.getElementById("rec-btn");
  if(recorder && recorder.state === "recording"){
    recorder.stop();
    return;
  }
  if(!navigator.mediaDevices || !window.MediaRecorder){
    document.getElementById("rec-hint").textContent = "此环境不支持录音，可直接提交。";
    log("录音不可用");
    return;
  }
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    chunks = [];
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = function(e){ if(e.data.size) chunks.push(e.data); };
    recorder.onstop = function(){
      stream.getTracks().forEach(function(t){ t.stop(); });
      var blob = new Blob(chunks, {type:"audio/webm"});
      recUrl = URL.createObjectURL(blob);
      clearInterval(recTimer);
      var dot = document.getElementById("rec-dot");
      if(dot) dot.classList.remove("live");
      var slot = document.getElementById("audio-slot");
      if(slot){
        slot.innerHTML = '<div class="rec"><span class="small">存档录音：</span><audio controls src="'+recUrl+'" style="flex:1;min-width:180px"></audio><span class="small">不参与判定</span></div>';
      }
      var b = document.getElementById("rec-btn");
      if(b) b.innerHTML = '<span class="rec-dot"></span> 重录';
      log("录音存档完成");
    };
    recorder.start();
    recStart = Date.now();
    var dot = document.getElementById("rec-dot");
    if(dot) dot.classList.add("live");
    document.getElementById("rec-btn").textContent = "停止录音";
    recTimer = setInterval(function(){
      var s = Math.floor((Date.now()-recStart)/1000);
      var el = document.getElementById("rec-time");
      if(el) el.textContent = "00:"+(s<10?"0":"")+s;
    }, 500);
  }).catch(function(){
    document.getElementById("rec-hint").textContent = "拿不到麦克风权限，可直接提交。";
    log("录音权限失败");
  });
}

/* ---------- 判定 ---------- */
function judge(){
  state.attempts += 1;
  var all = "";
  var wrong = [];
  state.sel.forEach(function(oi, si){
    var o = SLOTS[si].options[oi];
    all += o.t + " ";
    if(!o.ok) wrong.push(si);
  });
  state.reportTone = SLOTS[4].options[state.sel[4]].tone || "normal";

  var hitKW = KW.filter(function(k){
    return k.any.some(function(a){ return all.indexOf(a) > -1; });
  });
  state.hits = hitKW.map(function(h){ return h.label; });

  var hasRequired = all.indexOf(RULESET.required_word) > -1 &&
    RULESET.required_negatives.some(function(n){ return all.indexOf(n) > -1; });

  var threshold = state.attempts >= RULESET.attempts_before_fallback
    ? RULESET.fallback_hits : RULESET.pass_hits;
  var passed = hitKW.length >= threshold && hasRequired;

  state.lastResult = {
    passed:passed, threshold:threshold, hasRequired:hasRequired,
    wrong:wrong, count:hitKW.length
  };
  log("提交第"+state.attempts+"次：命中"+hitKW.length+"/11，阈值"+threshold+"，结论句="+state.reportTone+"，结果="+(passed?"采信":"未采信"));
  state.scene = "result";
  render();
}

function renderResult(){
  var r = state.lastResult;
  var html = '<p class="eyebrow">组织回信</p>';

  if(r.passed){

      : (state.reportTone === "normal"
        ? "结论下得清楚，只是那句写得直了些，下回可以再软一点。"
        : "结论对，但是话说得太白，卷宗是要留档的。");
    html += '<div class="receipt">'+
      '<p>吾友：卷宗已阅。乡音清楚，条理不差。后埕一事，本非怪事，乃人情。</p>'+
      '<p>'+esc(toneLine)+'</p>'+
      (r.wrong.length ? '<p>第 '+r.wrong.map(function(i){return i+1;}).join("、")+' 段与卷宗略有出入，已用朱笔圈出，下回留意。</p>' : '')+
      '<p>随函附见习稽查员证一枚，另附注音卡一张。往后到了渔村，先学称呼，再问事情。</p>'+
      '<p class="sig">——南音馆 稽查组</p>'+
    '</div>'+
    '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center">'+
      '<button class="btn primary" id="open-parcel">拆开包裹</button>'+
      '<span class="small">命中 '+r.count+'/11 个关键词，结论句分档：'+esc({smart:"地道",normal:"通过",blunt:"通过·无加分"}[state.reportTone])+'</span>'+
    '</div>';
  } else {
    var missing = KW.filter(function(k){ return state.hits.indexOf(k.label) === -1; });
    html += '<div class="receipt bad-box">'+
      '<p class="bad">乡音未清，线索难凭。</p>'+
      '<p>你所报数处含糊，尤以礁石一节，未能指认叫名之人。请携卷宗重录，勿以传闻充证。</p>'+
      (r.hasRequired ? '' : '<p>另：结论一句未见落定，魔神仔究竟有无，须说明。</p>')+
      '<p class="sig">——南音馆 稽查组</p>'+
    '</div>'+
    '<p class="small" style="margin-top:14px">缺的关键词（命中 '+r.count+'/11，本次阈值 '+r.threshold+'）：</p>'+
    '<div class="tags">'+ missing.map(function(k){ return '<span class="tag miss">'+esc(k.label)+'</span>'; }).join("")+'</div>'+
    '<div style="margin-top:16px"><button class="btn primary" id="retry">回去重录</button>'+
    '<span class="small" style="margin-left:10px">'+(state.attempts >= RULESET.attempts_before_fallback ? "组织已降低要求，按 6/11 判定。" : "可重录，最多三次后会降低要求。")+'</span></div>';
  }

  wrap.innerHTML = '<div class="panel">'+html+'</div>';

  var ob = document.getElementById("open-parcel");
  if(ob) ob.addEventListener("click", function(){ state.scene = "cert"; render(); });
  var rb = document.getElementById("retry");
  if(rb) rb.addEventListener("click", function(){
    state.sel = [-1,-1,-1,-1,-1];
    state.scene = "report";
    render();
  });
}

    '<p class="lede">牛皮纸里三样东西：一枚证、一张注音卡，还有一行铅笔字——「先学称呼，再问事情」。</p>'+
    '<div class="cert-wrap"><div class="cert">'+
      '<div class="c-top"><span>南音馆 · 稽查组</span><span>稽字第 0041 号</span></div>'+
      '<h3>调查员证</h3>'+
      '<p class="c-rank">见习稽查员</p>'+
      '<div class="c-body">'+
        '<div class="photo"></div>'+
        '<div class="fields">'+
          '<p><b>权限</b>后埕村及邻近三村 · 日间查访</p>'+
          '<p><b>语料</b>日常问答十二词、问事三句型</p>'+
          '<p><b>发证</b>组织已采信本卷</p>'+
          '<p><b>备考</b>在地稽查员 · 渔村与市集</p>'+
        '</div>'+
      '</div>'+
      '<p class="note">本证为职务凭证，向守祠人、船家出示时须正面朝上。证件褪色，视为乡音已疏。</p>'+
      '<div class="stamp">南音馆<br>稽查组</div>'+
    '</div></div>'+
    '<div class="rule"></div>'+
    '<p class="small">本局摘要：命中 '+state.hits.length+'/11 个关键词　·　提交 '+state.attempts+' 次　·　词卡查看 '+state.cardsSeen+' 次　·　用时约 '+mins+' 分钟</p>'+
    '<div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">'+
      '<button class="btn ghost" id="again">再查一遍</button>'+
      '<button class="btn ghost" id="tone-check">查看本局判定日志</button>'+
    '</div>'+
    '<div id="tone-out"></div>'+
  '</div>';

  document.getElementById("again").addEventListener("click", function(){
    state = {
      scene:"intro", step:0, clues:[], sel:[-1,-1,-1,-1,-1], attempts:0, hits:[],
      lastResult:null, cardsSeen:0, startedAt:Date.now(), events:[], reportTone:null
    };
    go("intro");
  });
  document.getElementById("tone-check").addEventListener("click", function(){
    var out = document.getElementById("tone-out");
    if(out.innerHTML){ out.innerHTML = ""; return; }
    out.innerHTML = '<div class="receipt" style="margin-top:12px;font-size:13px">'+
      state.events.map(function(e){ return '<p style="margin:0">['+e.t+'s] '+esc(e.e)+'</p>'; }).join("")+
    '</div>';
  });
}

/* ---------- 参数面板 ---------- */
function renderDebug(){
  var dbg = document.getElementById("debug");
  if(!dbg) return;
  dbg.innerHTML = '<div>ruleset_id：'+esc(RULESET.ruleset_id)+'</div>'+
    '<div>阈值：通过 '+RULESET.pass_hits+'/11，第 '+RULESET.attempts_before_fallback+' 次起降为 '+RULESET.fallback_hits+'/11</div>'+
    '<pre>'+esc(JSON.stringify({
      keyword_ids: KW.map(function(k){ return k.id; }),
      required:{word:RULESET.required_word, negatives:RULESET.required_negatives},
      tone:{smart:2, normal:1, blunt:0},
      note:RULESET.calorie_note
    }, null, 1))+'</pre>'+
    '<div style="margin-top:8px;color:#7A8579">最近事件</div>'+
    '<pre>'+esc(state.events.slice(-6).map(function(e){ return "["+e.t+"s] "+e.e; }).join("\n"))+'</pre>';
}

document.getElementById("dbg-btn").addEventListener("click", function(){
  var dbg = document.getElementById("debug");
  dbg.classList.toggle("on");
  this.style.display = "none";
  var self = this;
  dbg.addEventListener("click", function(){ dbg.classList.remove("on"); self.style.display = "block"; });
  renderDebug();
});

/* ---------- 启动 ---------- */
renderRail();
renderIntro();
renderDebug();
</script>
